# ChristmasSeason - festive mobs
#
# Wichtel are mischievous baby zombies, elves are helpful allays, snowmen throw snowballs.
# 'enabled' switches a whole mob type, 'steal.*', 'pranks.enabled' and 'helpers.enabled'
# switch a group, and every single feature below has its own switch.
# Players can opt out of each mob type with /xmasoptout.
# Mischief (stealing, pranks) and crop growing never happen inside WorldGuard regions or
# GriefPrevention claims.

# Per-player spawn caps (0 = disabled): counts matching mobs within spawning.nearRadius blocks
spawning:
  nearRadius: 48

wichtel:
  enabled: true
  spawnIntervalSeconds: 45
  maxPerWorld: 6            # counted per world
  maxNearPlayer: 0
  lifetimeSeconds: 240
  world: "world"            # extra world besides the snow worlds, empty = snow worlds only
  stealRadius: 3.2          # reach for decoration items and stolen items

  # Carry off one item lying on the ground or sitting in an item frame; it goes back to its
  # frame or spot when the Wichtel dies or disappears. Never near a recent player death,
  # never shulker boxes or bundles, never fixed item frames.
  steal:
    items: true
    itemFrames: true
    chance: 0.25            # chance per check (every 2 s) to take an item in reach
    blacklist: []           # materials that are never taken, e.g. - ELYTRA

  # Harmless pranks on players nearby (never on players in creative or spectator mode)
  pranks:
    enabled: true
    chance: 0.1             # chance per check (every 2 s) that a Wichtel plays a prank
    radius: 8               # players within this distance can be pranked
    playerCooldownSeconds: 90   # a player is pranked at most once in this time
    runAway: true           # a Wichtel carrying loot runs away from players
    snowball: true          # throws a snowball (no damage, slight knockback)
    tieShoes: true          # ties the shoelaces together: 3 s of Slowness
    doorsAndCandles: true   # opens or closes a wooden door, trapdoor or gate, blows out candles
    hide: true              # turns invisible for 5 s

elves:
  enabled: true
  spawnIntervalSeconds: 60
  maxPerWorld: 4
  maxNearPlayer: 0
  lifetimeSeconds: 240
  world: ""                 # extra world besides the snow worlds, empty = snow worlds only

  # Friendly help for players nearby
  helpers:
    enabled: true
    chance: 0.15            # chance per check (every 2 s) that an elf helps a player
    radius: 10              # players and items within this distance
    playerCooldownSeconds: 120  # heal, treats and gift trail reach a player at most once in this time
    returnLoot: true        # flies loot back to its item frame, its owner or its spot (off = back by magic)
    chaseWichtel: true      # chases a Wichtel carrying loot and takes it off it
    heal: true              # a few seconds of Regeneration for players low on health
    healBelowHealth: 8      # health points (2 = one heart)
    giftTrail: true         # sparkle trail towards the nearest gift
    treats: true            # hands over baked goods
    treatDistance: 3        # only to players this close to the elf
    treatItems:             # "MATERIAL:amount", one is picked at random
      - COOKIE:3
      - PUMPKIN_PIE:1
      - CAKE:1
    growCrops: true         # crops nearby grow one stage

snowmen:
  enabled: true
  spawnIntervalSeconds: 45
  maxPerWorld: 6
  maxNearPlayer: 0
  lifetimeSeconds: 600      # 0 = snowmen stay until /xmas off
  # Snowballs at players and hostile mobs in sight, without damage (knockback only)
  attackIntervalSeconds: 3
  attackChance: 0.5         # chance per interval to throw
  range: 12.0
  attackPlayers: true       # opted-out players and xmas.bypass.snowmen are never targeted
  attackMobs: true
