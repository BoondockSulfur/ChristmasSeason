# ========================================
# ChristmasSeason - Türkçe mesajlar
# Renk kodları '&' ile. Burada olmayan konsol mesajları (log.*) İngilizce kalır.
# ========================================

prefix: "&b[Xmas]&7"
no-permission: "&cYetkin yok."

# Komutlar - /xmas
command:
  usage: "&b/xmas &7<on|off|status|reload|biome|storm|backup|update|debug>"
  players-only: "&cBu komut yalnızca oyun içinde kullanılabilir."

  # Tırnak gerekli, çünkü YAML 'on'/'off' değerlerini mantıksal değer olarak okur
  "on":
    success: "&aEtkinlik açıldı. &7(Kar özellikleri çalışıyor)"
    restore-running: "&c&lBiyom geri yüklemesi hâlâ sürüyor! &7Lütfen bitmesini bekle."
    already-active: "&eChristmasSeason zaten açık. &7Özellikleri yeniden başlatmak için '/xmas reload' kullan."
    activation-running: "&eChristmasSeason şu anda açılıyor (SAFE yedeği). &7Lütfen biraz bekle."
    backup-failed: "&c&lUYARI: SAFE yedeği oluşturulamadı! &7Disk alanını ve yedek klasörünün izinlerini kontrol et."
    snapshot-disabled: "&c&lUYARI: Anlık görüntü sistemi kapalı (enableSnapshot: false)! &cBiyomlar YEDEKSİZ değiştiriliyor - otomatik geri yükleme mümkün değil."

  "off":
    cleanup: "&7Etkinlik varlıkları, eşyaları ve hediye sandıkları kaldırılıyor..."
    success: "&cEtkinlik kapatıldı. &7(Biyomlar ve kar parça parça geri yükleniyor)"
    backup-failed: "&c&lUYARI: Zaman damgalı yedek başarısız! &7Geri yükleme yine de devam ediyor."
    already-inactive: "&eChristmasSeason zaten kapalı. &7Önceki bir geri yüklemeden kalan anlık görüntüler varsa yeniden işleniyor."

  status:
    message: "&bDurum: {0} &7| Kar fırtınası: {1}"
    active: "&aAÇIK"
    inactive: "&cKAPALI"
    region: "&7Bölge koruması: &f{0}"
    restoring: "&eBiyom geri yüklemesi sürüyor: &f{0}"
    worlds: "&7Karlı dünyalar: &f{0}"
    objects: "&7Takip edilen: &f{0} &7hediye sandığı, &f{1} &7süs, &f{2} &7cüce/elf, &f{3} &7kardan adam"
    snapshot: "&7Anlık görüntüdeki chunk sayısı: &f{0}"
    converting: "&eDünya dönüştürmesi sürüyor: &f{0}"
    schedule: "&7Takvim: başlangıca &f{0} &7gün, bitişe &f{1} &7gün"
    gifts-opened: "&7Şimdiye kadar açılan hediyeler: &f{0}"

  reload:
    success: "&aYapılandırma ve dil yeniden yüklendi."
    error: "&cYeniden yükleme başarısız - konsola bak."

  biome:
    usage: "&b/xmas biome &7<set|clearsnap|status|info|compare|fix-diff|convert-all>"
    conversion-unavailable: "&cBiyom değişiklikleri kullanılamıyor: &7'biome.enabled' kapalı veya anlık görüntü veritabanı açılamadı."

    set:
      usage: "&b/xmas biome set &e<BİYOM> &7[yarıçap_chunk]"
      unknown-biome: "&cBilinmeyen biyom."
      invalid-radius: "&cYarıçap için geçersiz sayı."
      only-active: "&c/xmas biome set yalnızca ChristmasSeason açıkken çalışır. &7Önce '/xmas on' çalıştır."
      success: "&aBiyom ayarlandı: &e{0} &7chunk planlandı."

    restore:
      disabled: "&c&lBu komut devre dışı &7(sunucuyu dondurabiliyordu). Biyomları geri yüklemek için '/xmas off' kullan."

    clearsnap:
      success: "&aAnlık görüntü silindi."
      failed: "&cAnlık görüntü silinemedi. &7Ayrıntılar konsolda."
      blocked-active: "&c&lHATA: ChristmasSeason açık! &7Biyomlar değişmişken anlık görüntüyü silmek orijinalleri kalıcı olarak kaybettirir. Önce '/xmas off' çalıştır."
      no-backup: "&c&lUYARI: Hiç yedek yok! &7Önce bir tane oluştur: '/xmas backup create'"

    status:
      header: "&7═══ Anlık görüntü veritabanı ═══"
      db-inactive: "&c✗ Veritabanı: ETKİN DEĞİL &7(etkinlik kapalı veya enableSnapshot: false)"
      db-active: "&a✓ Veritabanı: ETKİN"
      db-chunks: "&7  Chunk: &f{0}"
      db-size: "&7  Boyut: &f{0} MB"
      db-error: "&c✗ Veritabanı okunurken hata: {0}"

    compare:
      usage: "&b/xmas biome compare &e<yedek-ID> &7- mevcut biyomları bir yedekle karşılaştırır"
      running: "&7Biyomlar yedekle karşılaştırılıyor... &7Bu biraz sürebilir."
      failed: "&c✗ Karşılaştırma başarısız! Konsola bak."
      header: "&6═══ KARŞILAŞTIRMA SONUCU ═══"
      backup: "&7Yedek: &f{0}"
      compared: "&7Karşılaştırılan chunk: &f{0}"
      identical: "&7Aynı: &a{0} &7(%{1})"
      differences: "&7Farklı: &c{0}"
      top-header: "&7Farkı en çok olan 5 chunk:"
      top-entry: "&7  {0}. &fChunk[{1}, {2}] &7- &c{3} &7hücre"
      fix-hint: "&eDüzelt: &f/xmas biome fix-diff {0}"
      footer: "&6═══════════════════════════"

    fix-diff:
      usage: "&b/xmas biome fix-diff &e<yedek-ID> &7[confirm] - farklı chunk'ları yedekten geri yükler"
      warning: "&c&lUYARI: &7Tüm farklı chunk'ların üzerine yedekteki biyomlar yazılacak!"
      confirm: "&eOnaylamak için: &f/xmas biome fix-diff {0} confirm"
      running: "&7Farklar düzeltiliyor... &7Bu birkaç dakika sürebilir."
      done: "&a✓ Düzeltme tamamlandı! &7Geri yüklenen: &f{0} &7chunk"
      failed: "&c✗ Düzeltme başarısız! Konsola bak."

    info:
      header: "&6═══ &f{0} {1} {2} &6konumunda biyom bilgisi ═══"
      current: "&7Mevcut biyom: &f{0} &7- doğal olarak karlı: {1}&7, doğal olarak buzlu: {2}"
      original: "&7Orijinal (anlık görüntü): &f{0} &7- doğal olarak karlı: {1}&7, doğal olarak buzlu: {2}"
      no-snapshot: "&7Bu chunk için anlık görüntü yok &8(hiç dönüştürülmedi ya da geri yüklenip temizlendi)"
      flags: "&7Hariç tutulan: {0} &7| bu oturumda işlendi: {1} &7| elle ayarlandı: {2}"
      range: "&7Ayarlanan Y aralığı: &f{0} &7- &f{1}"
      # Tırnak gerekli, çünkü YAML yes/no değerlerini mantıksal değer olarak okur
      "yes": "&aevet"
      "no": "&chayır"
    convert-all:
      usage: "&b/xmas biome convert-all &e[yarıçap_chunk] [dünya] confirm &7- doğma noktası çevresindeki tüm alanı dönüştürür"
      warning: "&c&lUYARI: &7Bu işlem &f{1} &7dünyasında &f{0} &7chunk yükleyip dönüştürür. Anlık görüntü veritabanı da buna göre büyür."
      confirm: "&eOnaylamak için: &f/xmas biome convert-all {0} {1} confirm"
      started: "&a✓ Dönüştürme başladı: &f{1} &7dünyasında &f{0} &7chunk. İlerleme konsolda ve '/xmas status' ile görülebilir."
      running: "&eZaten bir dönüştürme sürüyor: &f{0} &7- '/xmas biome convert-all cancel' durdurur."
      cancelled: "&c✗ Dönüştürme iptal edildi."
      only-active: "&cconvert-all yalnızca ChristmasSeason açıkken çalışır."
      not-snow-world: "&cBu dünya karlı bir dünya değil (config.yml içindeki snowWorld/snowWorlds ayarına bak)."
      radius-too-large: "&cYarıçap {0} çok büyük - en fazla &f{1} &cchunk izinli."

  debug:
    "on": "&a✓ Hata ayıklama modu açıldı. &7İpucu: daha fazla ayrıntı için '/xmas debug verbose'."
    "off": "&c✗ Hata ayıklama modu kapatıldı."
    verbose-on: "&a✓ Ayrıntılı hata ayıklama açıldı &7(biyom anlık görüntü ayrıntıları dahil)."
    verbose-off: "&c✗ Ayrıntılı hata ayıklama kapatıldı. &7Normal hata ayıklama kayıtları açık kalır."

  storm:
    usage: "&b/xmas storm &7<on|off|toggle|status|pulse>"
    "on": "&bKar fırtınası: &aAÇIK"
    "off": "&bKar fırtınası: &cKAPALI"
    toggle: "&bKar fırtınası: {0}"
    status: "&bKar fırtınası: {0}"
    pulse:
      success: "&bKar fırtınası: &e{0}&7 sn'lik darbe."
      invalid-duration: "&cGeçersiz saniye sayısı."
      world-not-found: "&cHedef dünya bulunamadı."

  update:
    usage: "&b/xmas update &7<check>"
    checking: "&7Güncellemeler kontrol ediliyor..."
    available: "&a&lGüncelleme mevcut! &7Mevcut: &c{0} &7- En yeni: &a{1}"
    links: "&7İndir: &f{0} &7| &f{1}"
    up-to-date: "&a✓ En güncel sürümü kullanıyorsun &7({0})."
    failed: "&c✗ Güncelleme kontrolü başarısız. &7Modrinth veya GitHub ile bağlantı yok."

  backup:
    usage: "&b/xmas backup &7<list|restore|create|clear>"
    restoring: "&7Yedek geri yükleniyor..."
    restored: "&a✓ Yedek geri yüklendi!"
    restore-failed: "&c✗ Geri yükleme başarısız! Konsola bak."
    creating: "&7Yedek oluşturuluyor..."
    created: "&a✓ Yedek oluşturuldu!"
    create-failed: "&c✗ Yedekleme başarısız! Konsola bak."
    blocked-active: "&cYedekler yalnızca etkinlik kapalıyken geri yüklenebilir. &7Önce '/xmas off' çalıştır ve geri yüklemeyi bekle."
    clear-confirm: "&c&lUYARI: &7Bu işlem &f{0} &7zaman damgalı ve acil durum yedeğini siler (SAFE kalır). Onaylamak için: &f/xmas backup clear confirm"

  feature:
    usage: "&b/xmas feature &e<ad> <on|off> &7- bir özelliği çalışırken açar/kapatır (config.yml'ye kaydedilir)"
    unknown: "&cBilinmeyen özellik: &f{0}"
    status-on: "&7Özellik &f{0}&7: &aaçık"
    status-off: "&7Özellik &f{0}&7: &ckapalı"
    enabled: "&a✓ Özellik &f{0} &aaçıldı."
    disabled: "&c✗ Özellik &f{0} &ckapatıldı."

  stats:
    header: "&6═══ Hediye istatistikleri &7(toplam açılan: &f{0}&7) ═══"
    entry: "&7  {0}. &f{1} &7- &e{2}"
    player: "&7{0}: &e{1} &7hediye açıldı, &e{2} &7advent kapısı"
    unknown-player: "&cBilinmeyen oyuncu: &f{0}"

# Komutlar - /xmasgift
gift:
  spawned: "&aHediye yerleştirildi!"
  spawn-failed: "&cBuraya hediye yerleştirilmedi &7(yanında başka bir sandık var)."
  opened: "&a🎁 Mutlu Noeller! &7Şimdiye kadar &e{0} &7hediye açtın."

# Varlık ve eşya adları
entity:
  wichtel: "&aCüce"
  elf: "&bElf"
  snowman: "&fKardan adam"
  decoration: "&aNoel süsü"
  gift-chest: "&c&lNoel hediyesi"

# Duyurular
broadcast:
  gift-spawned: "&c🎁 &e{0} &cdünyasında &e{1} {2} {3} &ckonumunda bir Noel hediyesi belirdi!"
  gift-opened: "&a🎁 &e{0}&a, &e{1} {2} {3} &akonumunda bir Noel hediyesi açtı!"
  event-activated: "&b❄ &fNoel sezonu başladı! &7Kar, hediyeler ve neşeli bir topluluk seni bekliyor."
  event-deactivated: "&b❄ &fNoel sezonu sona erdi. &7Bizimle kutladığın için teşekkürler!"

# Advent takvimi
advent:
  usage: "&b/advent &7[status|<gün>]"
  disabled: "&cAdvent takvimi devre dışı."
  event-inactive: "&cAdvent takvimi yalnızca Noel etkinliği sırasında kullanılabilir."
  not-in-season: "&cAdvent takvimi {0}.{1}. ile {2}.{3}. arasında açık."
  invalid-day: "&cLütfen {0} ile {1} arasında bir gün seç."
  future-day: "&c{0}. kapı henüz açılmadı - sabırlı ol!"
  no-catch-up: "&cBu sunucuda kaçırılan kapılar sonradan açılamaz."
  already-claimed: "&e{0}. kapıyı zaten açtın."
  claimed: "&a🎄 {0}. kapı açıldı! &7Ödülün envanterinde."
  broadcast: "&a🎄 &e{0}&a, advent takviminin &e{1}&a. kapısını açtı!"
  status-header: "&6═══ Advent takvimi &7({0}/{1} kapı açıldı) ═══"
  today-claimed: "&7Bugünün kapısı ({0}) zaten açık."
  today-open: "&e{0}. kapı seni bekliyor: &f/advent"

# Operatörler için güncelleme bildirimi (bağlantılar tıklanabilir metin olarak eklenir)
update:
  header: "&8&l&m                                    "
  available: "&b&lChristmasSeason &7- &aGüncelleme mevcut!"
  current: "&7Mevcut sürüm: &c{0}"
  latest: "&7En yeni sürüm: &a{0}"
  download: "&7İndir:"
  footer: "&8&l&m                                    "

# Oyuncuların da gördüğü konsol mesajları (geri kalanı İngilizce kalır)
log:
  convert:
    progress: "Dünya dönüştürmesi: {0}/{1} chunk"
    complete: "Dünya dönüştürmesi tamamlandı: {1} sn içinde {0} chunk"
  backup:
    cleared: "{0} yedek silindi."
    list-header: "&6=== YEDEKLER ==="
    list-entry: "&7  [{0}] &f{1} &7({2} KB)"
    list-empty: "&7Kullanılabilir yedek yok."
    list-footer: "&6================"
    restore-usage: "&b/xmas backup restore &e<ID> &7[confirm]"
    invalid-id: "&cGeçersiz yedek ID'si. &7Bkz. /xmas backup list"
    restore-confirm: "&aLütfen geri yüklemeyi onayla:"
    restore-warning: "&c  Mevcut veritabanı değiştirilecek!"
    restore-command: "&e  /xmas backup restore {0} confirm"
