# ========================================
# ChristmasSeason - Deutsche Texte
# Farbcodes mit '&'. Schlüssel unter 'log.' sind nur für die Konsole (Farben werden entfernt).
# ========================================

prefix: "&b[Xmas]&7"
no-permission: "&cKeine Berechtigung."

# Befehle - /xmas
command:
  usage: "&b/xmas &7<on|off|status|reload|biome|storm|backup|update|debug>"
  players-only: "&cDieser Befehl geht nur im Spiel."

  # Anführungszeichen nötig, weil YAML 'on'/'off' als Boolean liest
  "on":
    success: "&aEvent aktiviert. &7(Schnee-Features laufen)"
    restore-running: "&c&lEin Biome-Restore läuft noch! &7Bitte warten, bis er abgeschlossen ist."
    already-active: "&e&lChristmasSeason ist bereits aktiv. &7Features werden neu gestartet, bestehende Snapshots bleiben erhalten."
    backup-failed: "&c&lWARNUNG: SAFE-Backup konnte nicht erstellt werden! &7Speicherplatz und Rechte im Backup-Ordner prüfen."
    snapshot-disabled: "&c&lWARNUNG: Snapshot-System ist deaktiviert (enableSnapshot: false)! &cBiome werden OHNE Backup geändert - kein automatisches Restore möglich."

  "off":
    cleanup: "&7Entferne Event-Mobs, Items und Geschenkkisten..."
    success: "&cEvent deaktiviert. &7(Biome und Schnee werden in Batches zurückgesetzt)"
    backup-failed: "&c&lWARNUNG: Timestamp-Backup fehlgeschlagen! &7Restore läuft trotzdem."

  status:
    message: "&bStatus: {0} &7| Schneesturm: {1}"
    active: "&aAN"
    inactive: "&cAUS"
    region: "&7Region-Schutz: &f{0}"
    restoring: "&eBiome-Restore läuft: &f{0}"
    worlds: "&7Schneewelten: &f{0}"
    objects: "&7Verfolgt: &f{0} &7Geschenkkisten, &f{1} &7Dekorationen, &f{2} &7Wichtel/Elfen, &f{3} &7Schneemänner"
    snapshot: "&7Snapshot-Chunks: &f{0}"
    converting: "&eWeltkonvertierung läuft: &f{0}"
    schedule: "&7Zeitplan: &f{0} &7Tage bis zum Start, &f{1} &7Tage verbleibend"
    gifts-opened: "&7Bisher geöffnete Geschenke: &f{0}"

  reload:
    success: "&aConfig und Sprache neu geladen."
    error: "&cReload fehlgeschlagen - siehe Konsole."

  biome:
    usage: "&b/xmas biome &7<set|clearsnap|status|info|compare|fix-diff|convert-all>"

    set:
      usage: "&b/xmas biome set &e<BIOM> &7[radius_chunks]"
      unknown-biome: "&cUnbekanntes Biom."
      invalid-radius: "&cUngültige Zahl für den Radius."
      only-active: "&c/xmas biome set funktioniert nur, wenn ChristmasSeason aktiv ist. &7Zuerst '/xmas on' ausführen."
      success: "&aBiom gesetzt: &e{0} &7Chunk(s) eingeplant."

    restore:
      disabled: "&c&lDieser Befehl ist deaktiviert &7(er konnte den Server einfrieren). Biome werden mit '/xmas off' zurückgesetzt."

    clearsnap:
      success: "&aSnapshot gelöscht."
      blocked-active: "&c&lFEHLER: ChristmasSeason ist aktiv! &7Das Löschen des Snapshots bei geänderten Biomen würde die Originale dauerhaft verlieren. Zuerst '/xmas off'."
      no-backup: "&c&lWARNUNG: Kein Backup vorhanden! &7Erst eines anlegen: '/xmas backup create'"

    status:
      header: "&7═══ Snapshot-Datenbank ═══"
      db-inactive: "&c✗ Datenbank: NICHT AKTIV &7(Event inaktiv oder enableSnapshot: false)"
      db-active: "&a✓ Datenbank: AKTIV"
      db-chunks: "&7  Chunks: &f{0}"
      db-size: "&7  Größe: &f{0} MB"
      db-error: "&c✗ Fehler beim Lesen der Datenbank: {0}"

    compare:
      usage: "&b/xmas biome compare &e<Backup-ID> &7- vergleicht aktuelle Biome mit einem Backup"
      running: "&7Vergleiche Biome mit Backup... &7Das kann etwas dauern."
      failed: "&c✗ Vergleich fehlgeschlagen! Siehe Konsole."
      header: "&6═══ VERGLEICHSERGEBNIS ═══"
      backup: "&7Backup: &f{0}"
      compared: "&7Chunks verglichen: &f{0}"
      identical: "&7Identisch: &a{0} &7({1}%)"
      differences: "&7Unterschiedlich: &c{0}"
      top-header: "&7Top 5 Chunks mit Unterschieden:"
      top-entry: "&7  {0}. &fChunk[{1}, {2}] &7- &c{3} &7Zellen"
      fix-hint: "&eKorrektur: &f/xmas biome fix-diff {0}"
      footer: "&6═══════════════════════════"

    fix-diff:
      usage: "&b/xmas biome fix-diff &e<Backup-ID> &7[confirm] - stellt abweichende Chunks aus einem Backup her"
      warning: "&c&lWARNUNG: &7Alle abweichenden Chunks werden mit den Backup-Biomen überschrieben!"
      confirm: "&eBestätigen mit: &f/xmas biome fix-diff {0} confirm"
      running: "&7Korrigiere Unterschiede... &7Das kann einige Minuten dauern."
      done: "&a✓ Korrektur abgeschlossen! &7Wiederhergestellt: &f{0} &7Chunks"
      failed: "&c✗ Korrektur fehlgeschlagen! Siehe Konsole."

    info:
      header: "&6═══ Biom-Info bei &f{0} {1} {2} &6═══"
      current: "&7Aktuelles Biom: &f{0} &7- natürlich verschneit: {1}&7, natürlich vereist: {2}"
      original: "&7Original (Snapshot): &f{0} &7- natürlich verschneit: {1}&7, natürlich vereist: {2}"
      no-snapshot: "&7Kein Snapshot für diesen Chunk &8(nie konvertiert oder nach dem Restore gelöscht)"
      flags: "&7Ausgeschlossen: {0} &7| in dieser Sitzung verarbeitet: {1} &7| manuell gesetzt: {2}"
      range: "&7Konfigurierter Y-Bereich: &f{0} &7bis &f{1}"
      yes: "&aja"
      no: "&cnein"
    convert-all:
      usage: "&b/xmas biome convert-all &e[Radius_Chunks] [Welt] confirm &7- konvertiert den ganzen Bereich um den Spawn"
      warning: "&c&lWARNUNG: &7Das lädt und konvertiert &f{0} &7Chunks in &f{1}&7. Die Snapshot-Datenbank wächst entsprechend."
      confirm: "&eBestätigen mit: &f/xmas biome convert-all {0} {1} confirm"
      started: "&a✓ Konvertierung gestartet: &f{0} &7Chunks in &f{1}&7. Fortschritt in der Konsole und unter '/xmas status'."
      running: "&eEs läuft bereits eine Konvertierung: &f{0} &7- '/xmas biome convert-all cancel' bricht ab."
      cancelled: "&c✗ Konvertierung abgebrochen."
      only-active: "&cconvert-all funktioniert nur, wenn ChristmasSeason aktiv ist."
      not-snow-world: "&cDiese Welt ist keine Schneewelt (siehe snowWorld/snowWorlds in der config.yml)."

  debug:
    "on": "&a✓ Debug-Modus aktiviert. &7Tipp: '/xmas debug verbose' für noch mehr Details."
    "off": "&c✗ Debug-Modus deaktiviert."
    verbose-on: "&a✓ Verbose-Debug aktiviert &7(inklusive Biome-Snapshot-Details)."
    verbose-off: "&c✗ Verbose-Debug deaktiviert. &7Normale Debug-Logs bleiben aktiv."

  storm:
    usage: "&b/xmas storm &7<on|off|toggle|status|pulse>"
    "on": "&bSchneesturm: &aAN"
    "off": "&bSchneesturm: &cAUS"
    toggle: "&bSchneesturm: {0}"
    status: "&bSchneesturm: {0}"
    pulse:
      success: "&bSchneesturm: &e{0}&7s Impuls."
      invalid-duration: "&cUngültige Zahl für Sekunden."
      world-not-found: "&cZielwelt nicht gefunden."

  update:
    usage: "&b/xmas update &7<check>"
    checking: "&7Prüfe auf Updates..."
    available: "&a&lUpdate verfügbar! &7Aktuell: &c{0} &7- Neueste: &a{1}"
    links: "&7Download: &f{0} &7| &f{1}"
    up-to-date: "&a✓ Du verwendest die neueste Version &7({0})."
    failed: "&c✗ Update-Prüfung fehlgeschlagen. &7Keine Verbindung zu Modrinth oder GitHub."

  backup:
    usage: "&b/xmas backup &7<list|restore|create|clear>"
    restoring: "&7Stelle Backup wieder her..."
    restored: "&a✓ Backup wiederhergestellt!"
    restore-failed: "&c✗ Wiederherstellung fehlgeschlagen! Siehe Konsole."
    creating: "&7Erstelle Backup..."
    created: "&a✓ Backup erstellt!"
    create-failed: "&c✗ Backup fehlgeschlagen! Siehe Konsole."

  feature:
    usage: "&b/xmas feature &e<Name> <on|off> &7- schaltet ein Feature zur Laufzeit um (wird in der config.yml gespeichert)"
    unknown: "&cUnbekanntes Feature: &f{0}"
    status-on: "&7Feature &f{0}&7: &aaktiv"
    status-off: "&7Feature &f{0}&7: &cinaktiv"
    enabled: "&a✓ Feature &f{0} &aaktiviert."
    disabled: "&c✗ Feature &f{0} &cdeaktiviert."

  stats:
    header: "&6═══ Geschenk-Statistik &7(gesamt geöffnet: &f{0}&7) ═══"
    entry: "&7  {0}. &f{1} &7- &e{2}"
    player: "&7{0}: &e{1} &7Geschenke geöffnet, &e{2} &7Adventstürchen"
    unknown-player: "&cUnbekannter Spieler: &f{0}"

# Befehle - /xmasgift
gift:
  spawned: "&aGeschenk gespawnt!"
  spawn-failed: "&cHier wurde kein Geschenk platziert &7(eine andere Kiste liegt direkt daneben)."
  opened: "&a🎁 Frohe Weihnachten! &7Du hast bisher &e{0} &7Geschenk(e) geöffnet."

# Namen von Mobs und Items
entity:
  wichtel: "&aWichtel"
  elf: "&bElf"
  snowman: "&fSchneemann"
  decoration: "&aWeihnachts-Deko"
  gift-chest: "&c&lWeihnachts-Geschenk"

# Broadcasts
broadcast:
  gift-spawned: "&c🎁 Ein Weihnachts-Geschenk ist in &e{0} &cbei &e{1} {2} {3} &cerschienen!"
  gift-opened: "&a🎁 &e{0} &ahat ein Weihnachts-Geschenk bei &e{1} {2} {3} &ageöffnet!"
  event-activated: "&b❄ &fDie Weihnachtszeit hat begonnen! &7Schnee, Geschenke und festliche Gesellschaft warten."
  event-deactivated: "&b❄ &fDie Weihnachtszeit ist vorbei. &7Danke fürs Mitfeiern!"

# Adventskalender
advent:
  usage: "&b/advent &7[status|<Tag>]"
  disabled: "&cDer Adventskalender ist deaktiviert."
  event-inactive: "&cDer Adventskalender ist nur verfügbar, solange das Weihnachts-Event aktiv ist."
  not-in-season: "&cDer Adventskalender läuft vom {0}.{1}. bis {2}.{3}."
  invalid-day: "&cBitte einen Tag zwischen {0} und {1} wählen."
  future-day: "&cTürchen {0} ist noch nicht offen - Geduld!"
  no-catch-up: "&cVerpasste Türchen können auf diesem Server nicht nachgeholt werden."
  already-claimed: "&eTürchen {0} hast du heute schon geöffnet."
  claimed: "&a🎄 Türchen {0} geöffnet! &7Deine Belohnung liegt im Inventar."
  broadcast: "&a🎄 &e{0} &ahat Türchen &e{1} &ades Adventskalenders geöffnet!"
  status-header: "&6═══ Adventskalender &7({0}/{1} Türchen geöffnet) ═══"
  today-claimed: "&7Das heutige Türchen ({0}) ist bereits offen."
  today-open: "&eTürchen {0} wartet auf dich: &f/advent"

# Update-Hinweis für Operatoren (Links werden klickbar angehängt)
update:
  header: "&8&l&m                                    "
  available: "&b&lChristmasSeason &7- &aUpdate verfügbar!"
  current: "&7Aktuelle Version: &c{0}"
  latest: "&7Neueste Version:  &a{0}"
  download: "&7Download:"
  footer: "&8&l&m                                    "

