# ========================================
# ChristmasSeason - 简体中文消息
# 颜色代码使用 '&'。此处未列出的控制台消息（log.*）保持英文。
# ========================================

prefix: "&b[Xmas]&7"
no-permission: "&c你没有权限。"

# 命令 - /xmas
command:
  usage: "&b/xmas &7<on|off|status|reload|biome|storm|backup|update|debug>"
  players-only: "&c此命令只能在游戏内使用。"

  # 需要引号，因为 YAML 会把 'on'/'off' 读成布尔值
  "on":
    success: "&a活动已开启。&7（降雪功能正在运行）"
    restore-running: "&c&l生物群系仍在恢复中！&7请等待恢复完成。"
    already-active: "&eChristmasSeason 已经开启。&7使用 '/xmas reload' 重启各项功能。"
    activation-running: "&eChristmasSeason 正在开启（SAFE 备份中）。&7请稍候。"
    backup-failed: "&c&l警告：无法创建 SAFE 备份！&7请检查磁盘空间和备份文件夹的权限。"
    snapshot-disabled: "&c&l警告：快照系统已禁用（enableSnapshot: false）！&c生物群系将在没有备份的情况下被修改 - 无法自动恢复。"

  "off":
    cleanup: "&7正在移除活动实体、物品和礼物箱..."
    success: "&c活动已关闭。&7（生物群系和积雪将分批恢复）"
    backup-failed: "&c&l警告：带时间戳的备份失败！&7恢复仍会继续进行。"
    already-inactive: "&eChristmasSeason 已经关闭。&7如果上次恢复过程中留下了快照，将再次重置这些快照。"

  status:
    message: "&b状态：{0} &7| 暴风雪：{1}"
    active: "&a开启"
    inactive: "&c关闭"
    region: "&7区域保护：&f{0}"
    restoring: "&e生物群系恢复中：&f{0}"
    worlds: "&7降雪世界：&f{0}"
    objects: "&7追踪中：&f{0} &7个礼物箱，&f{1} &7个装饰，&f{2} &7个小矮人/精灵，&f{3} &7个雪人"
    snapshot: "&7快照中的区块：&f{0}"
    converting: "&e世界转换中：&f{0}"
    schedule: "&7日程：距开始还有 &f{0} &7天，剩余 &f{1} &7天"
    gifts-opened: "&7已打开的礼物：&f{0}"

  reload:
    success: "&a配置和语言已重新加载。"
    error: "&c重新加载失败 - 请查看控制台。"

  biome:
    usage: "&b/xmas biome &7<set|clearsnap|status|info|compare|fix-diff|convert-all>"
    conversion-unavailable: "&c无法修改生物群系：&7'biome.enabled' 已关闭，或快照数据库无法打开。"

    set:
      usage: "&b/xmas biome set &e<生物群系> &7[半径_区块]"
      unknown-biome: "&c未知的生物群系。"
      invalid-radius: "&c半径数值无效。"
      only-active: "&c/xmas biome set 仅在 ChristmasSeason 开启时可用。&7请先执行 '/xmas on'。"
      success: "&a生物群系已设置：已安排 &e{0} &7个区块。"

    restore:
      disabled: "&c&l此命令已禁用&7（它可能导致服务器卡死）。请使用 '/xmas off' 恢复生物群系。"

    clearsnap:
      success: "&a快照已删除。"
      failed: "&c无法删除快照。&7详情请查看控制台。"
      blocked-active: "&c&l错误：ChristmasSeason 正在运行！&7在生物群系已被修改时删除快照会永久丢失原始数据。请先执行 '/xmas off'。"
      no-backup: "&c&l警告：没有可用的备份！&7请先创建一个：'/xmas backup create'"

    status:
      header: "&7═══ 快照数据库 ═══"
      db-inactive: "&c✗ 数据库：未激活 &7（活动未开启或 enableSnapshot: false）"
      db-active: "&a✓ 数据库：已激活"
      db-chunks: "&7  区块：&f{0}"
      db-size: "&7  大小：&f{0} MB"
      db-error: "&c✗ 读取数据库出错：{0}"

    compare:
      usage: "&b/xmas biome compare &e<备份ID> &7- 将当前生物群系与备份比较"
      running: "&7正在将生物群系与备份比较... &7这可能需要一些时间。"
      failed: "&c✗ 比较失败！请查看控制台。"
      header: "&6═══ 比较结果 ═══"
      backup: "&7备份：&f{0}"
      compared: "&7已比较区块：&f{0}"
      identical: "&7相同：&a{0} &7（{1}%）"
      differences: "&7不同：&c{0}"
      top-header: "&7差异最多的 5 个区块："
      top-entry: "&7  {0}. &f区块[{1}, {2}] &7- &c{3} &7个单元"
      fix-hint: "&e修复：&f/xmas biome fix-diff {0}"
      footer: "&6═══════════════════════════"

    fix-diff:
      usage: "&b/xmas biome fix-diff &e<备份ID> &7[confirm] - 从备份恢复不同的区块"
      warning: "&c&l警告：&7所有不同的区块都将被备份中的生物群系覆盖！"
      confirm: "&e确认请输入：&f/xmas biome fix-diff {0} confirm"
      running: "&7正在修复差异... &7这可能需要几分钟。"
      done: "&a✓ 修复完成！&7已恢复：&f{0} &7个区块"
      failed: "&c✗ 修复失败！请查看控制台。"

    info:
      header: "&6═══ &f{0} {1} {2} &6处的生物群系信息 ═══"
      current: "&7当前生物群系：&f{0} &7- 天然多雪：{1}&7，天然冰冻：{2}"
      original: "&7原始生物群系（快照）：&f{0} &7- 天然多雪：{1}&7，天然冰冻：{2}"
      no-snapshot: "&7此区块没有快照 &8（从未转换过，或已恢复并清除）"
      flags: "&7已排除：{0} &7| 本次会话已处理：{1} &7| 手动设置：{2}"
      range: "&7配置的 Y 范围：&f{0} &7至 &f{1}"
      # 需要引号，因为 YAML 会把 yes/no 读成布尔值
      "yes": "&a是"
      "no": "&c否"
    convert-all:
      usage: "&b/xmas biome convert-all &e[半径_区块] [世界] confirm &7- 转换出生点周围的整个区域"
      warning: "&c&l警告：&7这将在 &f{1} &7中加载并转换 &f{0} &7个区块。快照数据库会相应增大。"
      confirm: "&e确认请输入：&f/xmas biome convert-all {0} {1} confirm"
      started: "&a✓ 转换已开始：&f{1} &7中的 &f{0} &7个区块。进度见控制台和 '/xmas status'。"
      running: "&e已有转换正在进行：&f{0} &7- '/xmas biome convert-all cancel' 可停止。"
      cancelled: "&c✗ 转换已取消。"
      only-active: "&cconvert-all 仅在 ChristmasSeason 开启时可用。"
      not-snow-world: "&c该世界不是雪世界（参见 config.yml 中的 snowWorld/snowWorlds）。"
      radius-too-large: "&c半径 {0} 过大 - 最多允许 &f{1} &c个区块。"

  debug:
    "on": "&a✓ 调试模式已开启。&7提示：'/xmas debug verbose' 可显示更多细节。"
    "off": "&c✗ 调试模式已关闭。"
    verbose-on: "&a✓ 详细调试模式已开启&7（包含生物群系快照详情）。"
    verbose-off: "&c✗ 详细调试模式已关闭。&7普通调试日志仍然开启。"

  storm:
    usage: "&b/xmas storm &7<on|off|toggle|status|pulse>"
    "on": "&b暴风雪：&a开启"
    "off": "&b暴风雪：&c关闭"
    toggle: "&b暴风雪：{0}"
    status: "&b暴风雪：{0}"
    pulse:
      success: "&b暴风雪：持续 &e{0}&7 秒。"
      invalid-duration: "&c秒数无效。"
      world-not-found: "&c找不到目标世界。"

  update:
    usage: "&b/xmas update &7<check>"
    checking: "&7正在检查更新..."
    available: "&a&l有可用更新！&7当前：&c{0} &7- 最新：&a{1}"
    links: "&7下载：&f{0} &7| &f{1}"
    up-to-date: "&a✓ 你正在使用最新版本 &7（{0}）。"
    failed: "&c✗ 检查更新失败。&7无法连接 Modrinth 或 GitHub。"

  backup:
    usage: "&b/xmas backup &7<list|restore|create|clear>"
    restoring: "&7正在恢复备份..."
    restored: "&a✓ 备份已恢复！"
    restore-failed: "&c✗ 恢复失败！请查看控制台。"
    creating: "&7正在创建备份..."
    created: "&a✓ 备份已创建！"
    create-failed: "&c✗ 备份失败！请查看控制台。"
    blocked-active: "&c只有在活动关闭时才能恢复备份。&7请先执行 '/xmas off' 并等待恢复完成。"
    clear-confirm: "&c&l警告：&7这将删除 &f{0} &7个带时间戳的备份和紧急备份（SAFE 会保留）。确认请输入：&f/xmas backup clear confirm"

  feature:
    usage: "&b/xmas feature &e<名称> <on|off> &7- 在服务器运行期间启用或禁用功能（设置将保存到 config.yml）"
    unknown: "&c未知功能：&f{0}"
    status-on: "&7功能 &f{0}&7：&a已开启"
    status-off: "&7功能 &f{0}&7：&c已关闭"
    enabled: "&a✓ 功能 &f{0} &a已开启。"
    disabled: "&c✗ 功能 &f{0} &c已关闭。"

  stats:
    header: "&6═══ 礼物统计 &7（共打开：&f{0}&7）═══"
    entry: "&7  {0}. &f{1} &7- &e{2}"
    player: "&7{0}：已打开 &e{1} &7个礼物，开启 &e{2} &7扇降临节日历小门"
    unknown-player: "&c未知玩家：&f{0}"

# 命令 - /xmasgift
gift:
  spawned: "&a礼物已放置！"
  spawn-failed: "&c此处未放置礼物 &7（旁边有其他箱子）。"
  opened: "&a🎁 圣诞快乐！&7你目前已打开 &e{0} &7个礼物。"

# 生物和物品名称
entity:
  wichtel: "&a小矮人"
  elf: "&b精灵"
  snowman: "&f雪人"
  decoration: "&a圣诞装饰"
  gift-chest: "&c&l圣诞礼物"

# 广播
broadcast:
  gift-spawned: "&c🎁 圣诞礼物已出现在世界 &e{0}&c，坐标 &e{1} {2} {3}&c！"
  gift-opened: "&a🎁 &e{0} &a在 &e{1} {2} {3} &a打开了一个圣诞礼物！"
  event-activated: "&b❄ &f圣诞季开始了！&7雪花、礼物和欢乐的伙伴正等着你。"
  event-deactivated: "&b❄ &f圣诞季结束了。&7感谢你和我们一起庆祝！"

# 降临节日历
advent:
  usage: "&b/advent &7[status|<日期编号>]"
  disabled: "&c降临节日历已禁用。"
  event-inactive: "&c只有圣诞活动开启时才能使用降临节日历。"
  not-in-season: "&c降临节日历开放日期：{1}月{0}日 至 {3}月{2}日。"
  invalid-day: "&c请选择 {0} 到 {1} 之间的日期编号。"
  future-day: "&c第 {0} 扇门还没开放 - 请耐心等待！"
  no-catch-up: "&c本服务器不允许补开错过的门。"
  already-claimed: "&e你已经打开过第 {0} 扇门了。"
  claimed: "&a🎄 第 {0} 扇门已打开！&7奖励已放入你的背包。"
  broadcast: "&a🎄 &e{0} &a打开了降临节日历的第 &e{1} &a扇门！"
  status-header: "&6═══ 降临节日历 &7（已打开 {0}/{1} 扇门）═══"
  today-claimed: "&7今天的门（{0}）已经打开。"
  today-open: "&e第 {0} 扇门正在等你：&f/advent"

# 管理员更新提示（链接以可点击文本附加）
update:
  header: "&8&l&m                                    "
  available: "&b&lChristmasSeason &7- &a有可用更新！"
  current: "&7当前版本：&c{0}"
  latest: "&7最新版本：&a{0}"
  download: "&7下载："
  footer: "&8&l&m                                    "

# 玩家也能看到的控制台消息（其余保持英文）
log:
  convert:
    progress: "世界转换：{0}/{1} 个区块"
    complete: "世界转换完成：{0} 个区块，用时 {1} 秒"
  backup:
    cleared: "已删除 {0} 个备份。"
    list-header: "&6=== 备份 ==="
    list-entry: "&7  [{0}] &f{1} &7（{2} KB）"
    list-empty: "&7没有可用的备份。"
    list-footer: "&6================"
    restore-usage: "&b/xmas backup restore &e<ID> &7[confirm]"
    invalid-id: "&c备份 ID 无效。&7参见 /xmas backup list"
    restore-confirm: "&a请确认恢复："
    restore-warning: "&c  当前数据库将被替换！"
    restore-command: "&e  /xmas backup restore {0} confirm"
