# ========================================
# ChristmasSeason - Сообщения на русском
# Цветовые коды через '&'. Сообщения консоли (log.*), которых здесь нет, остаются на английском.
# ========================================

prefix: "&b[Xmas]&7"
no-permission: "&cНедостаточно прав."

# Команды - /xmas
command:
  usage: "&b/xmas &7<on|off|status|reload|biome|storm|backup|update|debug>"
  players-only: "&cЭту команду можно использовать только в игре."

  # Кавычки нужны, потому что YAML читает 'on'/'off' как логические значения
  "on":
    success: "&aСобытие включено. &7(Снежные функции работают)"
    restore-running: "&c&lВосстановление биомов ещё идёт! &7Подождите, пока оно завершится."
    already-active: "&eChristmasSeason уже включён. &7Используйте '/xmas reload', чтобы перезапустить функции."
    activation-running: "&eChristmasSeason сейчас включается (резервная копия SAFE). &7Подождите немного."
    backup-failed: "&c&lВНИМАНИЕ: не удалось создать копию SAFE! &7Проверьте место на диске и права папки резервных копий."
    snapshot-disabled: "&c&lВНИМАНИЕ: система снимков отключена (enableSnapshot: false)! &cБиомы меняются БЕЗ резервной копии - автоматическое восстановление невозможно."

  "off":
    cleanup: "&7Удаление существ, предметов и сундуков с подарками события..."
    success: "&cСобытие выключено. &7(Биомы и снег восстанавливаются частями)"
    backup-failed: "&c&lВНИМАНИЕ: копия с отметкой времени не создана! &7Восстановление всё равно продолжается."
    already-inactive: "&eChristmasSeason уже выключен. &7Снимки, оставшиеся от прошлого восстановления, обрабатываются повторно, если они есть."

  status:
    message: "&bСтатус: {0} &7| Метель: {1}"
    active: "&aВКЛ"
    inactive: "&cВЫКЛ"
    region: "&7Защита регионов: &f{0}"
    restoring: "&eИдёт восстановление биомов: &f{0}"
    worlds: "&7Снежные миры: &f{0}"
    objects: "&7Отслеживается: &f{0} &7сундуков с подарками, &f{1} &7украшений, &f{2} &7гномов/эльфов, &f{3} &7снеговиков"
    snapshot: "&7Чанков в снимке: &f{0}"
    converting: "&eИдёт преобразование мира: &f{0}"
    schedule: "&7Расписание: &f{0} &7дн. до начала, &f{1} &7дн. осталось"
    gifts-opened: "&7Открыто подарков: &f{0}"

  reload:
    success: "&aКонфигурация и язык перезагружены."
    error: "&cОшибка перезагрузки - смотрите консоль."

  biome:
    usage: "&b/xmas biome &7<set|clearsnap|status|info|compare|fix-diff|convert-all>"
    conversion-unavailable: "&cИзменение биомов недоступно: &7'biome.enabled' выключено или базу снимков не удалось открыть."

    set:
      usage: "&b/xmas biome set &e<БИОМ> &7[радиус_чанков]"
      unknown-biome: "&cНеизвестный биом."
      invalid-radius: "&cНеверное число для радиуса."
      only-active: "&c/xmas biome set работает только при включённом ChristmasSeason. &7Сначала выполните '/xmas on'."
      success: "&aБиом задан: запланировано чанков: &e{0}&7."

    restore:
      disabled: "&c&lЭта команда отключена &7(она могла заморозить сервер). Используйте '/xmas off', чтобы восстановить биомы."

    clearsnap:
      success: "&aСнимок удалён."
      failed: "&cНе удалось удалить снимок. &7Подробности в консоли."
      blocked-active: "&c&lОШИБКА: ChristmasSeason включён! &7Удаление снимка при изменённых биомах навсегда потеряет оригиналы. Сначала выполните '/xmas off'."
      no-backup: "&c&lВНИМАНИЕ: нет резервной копии! &7Сначала создайте её: '/xmas backup create'"

    status:
      header: "&7═══ База снимков ═══"
      db-inactive: "&c✗ База данных: НЕ АКТИВНА &7(событие выключено или enableSnapshot: false)"
      db-active: "&a✓ База данных: АКТИВНА"
      db-chunks: "&7  Чанков: &f{0}"
      db-size: "&7  Размер: &f{0} МБ"
      db-error: "&c✗ Ошибка чтения базы данных: {0}"

    compare:
      usage: "&b/xmas biome compare &e<ID-копии> &7- сравнивает текущие биомы с копией"
      running: "&7Сравнение биомов с копией... &7Это может занять время."
      failed: "&c✗ Сравнение не удалось! Смотрите консоль."
      header: "&6═══ РЕЗУЛЬТАТ СРАВНЕНИЯ ═══"
      backup: "&7Копия: &f{0}"
      compared: "&7Сравнено чанков: &f{0}"
      identical: "&7Совпадают: &a{0} &7({1}%)"
      differences: "&7Отличаются: &c{0}"
      top-header: "&7Топ-5 чанков с отличиями:"
      top-entry: "&7  {0}. &fЧанк[{1}, {2}] &7- &c{3} &7ячеек"
      fix-hint: "&eИсправить: &f/xmas biome fix-diff {0}"
      footer: "&6═══════════════════════════"

    fix-diff:
      usage: "&b/xmas biome fix-diff &e<ID-копии> &7[confirm] - восстанавливает отличающиеся чанки из копии"
      warning: "&c&lВНИМАНИЕ: &7все отличающиеся чанки будут перезаписаны биомами из копии!"
      confirm: "&eПодтвердите: &f/xmas biome fix-diff {0} confirm"
      running: "&7Исправление отличий... &7Это может занять несколько минут."
      done: "&a✓ Исправление завершено! &7Восстановлено чанков: &f{0}"
      failed: "&c✗ Исправление не удалось! Смотрите консоль."

    info:
      header: "&6═══ Информация о биоме в &f{0} {1} {2} &6═══"
      current: "&7Текущий биом: &f{0} &7- снежный от природы: {1}&7, ледяной от природы: {2}"
      original: "&7Оригинал (снимок): &f{0} &7- снежный от природы: {1}&7, ледяной от природы: {2}"
      no-snapshot: "&7Для этого чанка нет снимка &8(никогда не преобразовывался или был восстановлен и очищен)"
      flags: "&7Исключён: {0} &7| обработан в этой сессии: {1} &7| задан вручную: {2}"
      range: "&7Настроенный диапазон Y: &f{0} &7до &f{1}"
      # Кавычки нужны, потому что YAML читает yes/no как логические значения
      "yes": "&aда"
      "no": "&cнет"
    convert-all:
      usage: "&b/xmas biome convert-all &e[радиус_чанков] [мир] confirm &7- преобразует всю область вокруг спавна"
      warning: "&c&lВНИМАНИЕ: &7будет загружено и преобразовано &f{0} &7чанков в &f{1}&7. База снимков соответственно вырастет."
      confirm: "&eПодтвердите: &f/xmas biome convert-all {0} {1} confirm"
      started: "&a✓ Преобразование запущено: &f{0} &7чанков в &f{1}&7. Прогресс в консоли и в '/xmas status'."
      running: "&eПреобразование уже идёт: &f{0} &7- '/xmas biome convert-all cancel' останавливает его."
      cancelled: "&c✗ Преобразование отменено."
      only-active: "&cconvert-all работает только при включённом ChristmasSeason."
      not-snow-world: "&cЭтот мир не является снежным (см. snowWorld/snowWorlds в config.yml)."
      radius-too-large: "&cРадиус {0} слишком большой - допускается не более &f{1} &cчанков."

  debug:
    "on": "&a✓ Режим отладки включён. &7Совет: '/xmas debug verbose' показывает ещё больше."
    "off": "&c✗ Режим отладки выключен."
    verbose-on: "&a✓ Подробная отладка включена &7(включая данные снимков биомов)."
    verbose-off: "&c✗ Подробная отладка выключена. &7Обычные журналы отладки остаются включены."

  storm:
    usage: "&b/xmas storm &7<on|off|toggle|status|pulse>"
    "on": "&bМетель: &aВКЛ"
    "off": "&bМетель: &cВЫКЛ"
    toggle: "&bМетель: {0}"
    status: "&bМетель: {0}"
    pulse:
      success: "&bМетель: импульс на &e{0}&7 с."
      invalid-duration: "&cНеверное число секунд."
      world-not-found: "&cЦелевой мир не найден."

  update:
    usage: "&b/xmas update &7<check>"
    checking: "&7Проверка обновлений..."
    available: "&a&lДоступно обновление! &7Текущая: &c{0} &7- Последняя: &a{1}"
    links: "&7Скачать: &f{0} &7| &f{1}"
    up-to-date: "&a✓ У вас последняя версия &7({0})."
    failed: "&c✗ Проверка обновлений не удалась. &7Нет связи с Modrinth или GitHub."

  backup:
    usage: "&b/xmas backup &7<list|restore|create|clear>"
    restoring: "&7Восстановление копии..."
    restored: "&a✓ Копия восстановлена!"
    restore-failed: "&c✗ Восстановление не удалось! Смотрите консоль."
    creating: "&7Создание копии..."
    created: "&a✓ Копия создана!"
    create-failed: "&c✗ Создать копию не удалось! Смотрите консоль."
    blocked-active: "&cКопии можно восстанавливать только при выключенном событии. &7Сначала выполните '/xmas off' и дождитесь восстановления."
    clear-confirm: "&c&lВНИМАНИЕ: &7будет удалено копий с отметкой времени и аварийных: &f{0} &7(SAFE сохраняется). Подтвердите: &f/xmas backup clear confirm"

  feature:
    usage: "&b/xmas feature &e<имя> <on|off> &7- включает/выключает функцию на лету (сохраняется в config.yml)"
    unknown: "&cНеизвестная функция: &f{0}"
    status-on: "&7Функция &f{0}&7: &aвключена"
    status-off: "&7Функция &f{0}&7: &cвыключена"
    enabled: "&a✓ Функция &f{0} &aвключена."
    disabled: "&c✗ Функция &f{0} &cвыключена."

  stats:
    header: "&6═══ Статистика подарков &7(всего открыто: &f{0}&7) ═══"
    entry: "&7  {0}. &f{1} &7- &e{2}"
    player: "&7{0}: подарков открыто: &e{1}&7, окошек календаря: &e{2}"
    unknown-player: "&cНеизвестный игрок: &f{0}"

# Команды - /xmasgift
gift:
  spawned: "&aПодарок поставлен!"
  spawn-failed: "&cПодарок здесь не поставлен &7(рядом стоит другой сундук)."
  opened: "&a🎁 С Рождеством! &7Открыто подарков: &e{0}&7."

# Названия существ и предметов
entity:
  wichtel: "&aГном"
  elf: "&bЭльф"
  snowman: "&fСнеговик"
  decoration: "&aРождественское украшение"
  gift-chest: "&c&lРождественский подарок"

# Объявления
broadcast:
  gift-spawned: "&c🎁 В мире &e{0} &cпоявился рождественский подарок на &e{1} {2} {3}&c!"
  gift-opened: "&a🎁 &e{0} &aоткрыл рождественский подарок на &e{1} {2} {3}&a!"
  event-activated: "&b❄ &fРождественский сезон начался! &7Вас ждут снег, подарки и праздничная компания."
  event-deactivated: "&b❄ &fРождественский сезон закончился. &7Спасибо, что праздновали с нами!"

# Адвент-календарь
advent:
  usage: "&b/advent &7[status|<день>]"
  disabled: "&cАдвент-календарь отключён."
  event-inactive: "&cАдвент-календарь доступен только во время рождественского события."
  not-in-season: "&cАдвент-календарь работает с {0}.{1}. по {2}.{3}."
  invalid-day: "&cВыберите день от {0} до {1}."
  future-day: "&cОкошко {0} ещё закрыто - терпение!"
  no-catch-up: "&cНа этом сервере пропущенные окошки нельзя открыть позже."
  already-claimed: "&eВы уже открыли окошко {0}."
  claimed: "&a🎄 Окошко {0} открыто! &7Награда в вашем инвентаре."
  broadcast: "&a🎄 &e{0} &aоткрыл окошко &e{1} &aадвент-календаря!"
  status-header: "&6═══ Адвент-календарь &7(открыто {0}/{1}) ═══"
  today-claimed: "&7Сегодняшнее окошко ({0}) уже открыто."
  today-open: "&eОкошко {0} ждёт вас: &f/advent"

# Уведомление об обновлении для операторов (ссылки добавляются как кликабельный текст)
update:
  header: "&8&l&m                                    "
  available: "&b&lChristmasSeason &7- &aДоступно обновление!"
  current: "&7Текущая версия: &c{0}"
  latest: "&7Последняя версия: &a{0}"
  download: "&7Скачать:"
  footer: "&8&l&m                                    "

# Сообщения консоли, которые видят и игроки (остальные остаются на английском)
log:
  convert:
    progress: "Преобразование мира: {0}/{1} чанков"
    complete: "Преобразование мира завершено: {0} чанков за {1} с"
  backup:
    cleared: "Удалено копий: {0}."
    list-header: "&6=== РЕЗЕРВНЫЕ КОПИИ ==="
    list-entry: "&7  [{0}] &f{1} &7({2} КБ)"
    list-empty: "&7Нет доступных копий."
    list-footer: "&6================"
    restore-usage: "&b/xmas backup restore &e<ID> &7[confirm]"
    invalid-id: "&cНеверный ID копии. &7Смотрите /xmas backup list"
    restore-confirm: "&aПодтвердите восстановление:"
    restore-warning: "&c  Текущая база данных будет заменена!"
    restore-command: "&e  /xmas backup restore {0} confirm"
